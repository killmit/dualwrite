[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "killmit-dualwrite"
version = "0.1.0"
description = "按结构键把条目聚类，标出知识库的双写窗口上的同组项与各组的代表样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "killmit" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://killmit.github.io"
Repository = "https://github.com/killmit/dualwrite"
Issues = "https://github.com/killmit/dualwrite/issues"

[project.scripts]
dualwrite = "dualwrite:main"

[tool.setuptools]
py-modules = ["dualwrite"]
